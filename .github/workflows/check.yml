# PR을 올리거나 main에 반영될 때 웹앱 코드를 자동으로 검사한다.
# 타입 검사(코드 앞뒤가 맞는지) → lint(실수하기 쉬운 코드) → 시험(채점·복습·날짜 계산)
name: 코드 검사

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: 시험
        run: npm test
